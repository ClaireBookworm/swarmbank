name: Machine onboarding
on:
  pull_request:
    paths: ['machine-onboarding/**', '.github/workflows/machine-onboarding.yml']
  push:
    paths: ['machine-onboarding/**', '.github/workflows/machine-onboarding.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for script in machine-onboarding/*.sh machine-onboarding/lib/*.sh; do bash -n "$script"; done
          shellcheck -x -P machine-onboarding machine-onboarding/*.sh machine-onboarding/lib/*.sh
      - name: Offline configuration and safety tests
        run: python3 -m unittest discover -s machine-onboarding/tests -v
